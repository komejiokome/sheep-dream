<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#080f2a" />
  <meta name="description" content="羊を数え、夢の法則を書き換えながら朝を目指す短編インクリメンタルゲーム。" />
  <title>ひつじを数える — Sheep Dream</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body data-depth="0">
  <main class="app-shell">
    <section class="dream-stage card" aria-labelledby="game-title">
      <div class="sky-layers" aria-hidden="true">
        <div class="moon"></div>
        <div class="stars"></div>
        <div class="cloud cloud-a"></div>
        <div class="cloud cloud-b"></div>
      </div>

      <header class="scene-header">
        <p class="brand">SHEEP DREAM</p>
        <div class="phase-chip"><span id="phase-index">深度 0</span><strong id="phase-name">まどろみ</strong></div>
      </header>

      <div class="scene-copy">
        <h1 id="game-title">ひつじを数える</h1>
        <p id="story" class="story">羊を一匹ずつ数えてください。</p>
      </div>

      <div class="counter-wrap" aria-live="polite" aria-atomic="true">
        <span id="sheep-count" class="sheep-count">0</span><span class="counter-label">ひつじ</span>
      </div>

      <div id="pasture" class="pasture" aria-hidden="true">
        <span class="resting-sheep">🐑</span>
        <span class="hill hill-back"></span>
        <span class="hill hill-front"></span>
        <span class="fence">╫　╫　╫　╫　╫</span>
      </div>

      <div class="rate-line">
        <span><small>タップ</small><strong id="click-value">1</strong></span>
        <span><small>自動 / 秒</small><strong id="auto-rate">0</strong></span>
        <span><small>夢のかけら</small><strong id="dream-shards">0</strong></span>
      </div>
    </section>

    <section class="control-deck card" aria-label="夢の操作盤">
      <div class="depth-panel">
        <div class="depth-heading">
          <div><span class="kicker">NEXT DEPTH</span><strong>眠りの深さ <span id="sleep-depth">0</span> / 4</strong></div>
          <button id="deepen-button" class="deepen-button" type="button" disabled>深く眠る</button>
        </div>
        <div class="progress-track" role="progressbar" aria-label="次の眠りまでの進捗" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="sleep-progress" class="progress-fill"></div>
        </div>
        <p id="sleep-target" class="sleep-target">次の眠りまで 900匹</p>
      </div>

      <div class="tabs" role="tablist" aria-label="夢の操作">
        <button id="tab-upgrades" class="tab active" type="button" role="tab" aria-selected="true" aria-controls="panel-upgrades" data-tab="upgrades">眠り支度</button>
        <button id="tab-laws" class="tab" type="button" role="tab" aria-selected="false" aria-controls="panel-laws" data-tab="laws">夢の法則</button>
        <button id="tab-memory" class="tab" type="button" role="tab" aria-selected="false" aria-controls="panel-memory" data-tab="memory">寝言</button>
      </div>

      <div class="panel-stack">
        <section id="panel-upgrades" class="tab-panel" role="tabpanel" aria-labelledby="tab-upgrades">
          <div id="upgrades" class="shop-grid"></div>
        </section>
        <section id="panel-laws" class="tab-panel hidden" role="tabpanel" aria-labelledby="tab-laws">
          <div id="laws" class="shop-grid laws-grid"></div>
        </section>
        <section id="panel-memory" class="tab-panel hidden" role="tabpanel" aria-labelledby="tab-memory">
          <div id="event-log" class="event-log"></div>
        </section>
      </div>

      <section id="wake-card" class="wake-card hidden">
        <div><span class="kicker">MORNING</span><strong>もう、十分に数えた。</strong></div>
        <button id="wake-button" class="wake-button" type="button">起きる</button>
      </section>

      <div class="count-dock">
        <button id="count-button" class="count-button" type="button" aria-describedby="tap-hint">
          <span class="button-sheep" aria-hidden="true">🐑</span>
          <span><strong>羊を数える</strong><small id="tap-hint">複数の指で同時に押せます</small></span>
        </button>
      </div>
    </section>

    <div id="depth-transition" class="depth-transition" aria-hidden="true"><span id="transition-name">雲の寝床</span></div>

    <section id="ending" class="ending hidden" aria-live="polite">
      <div class="ending-inner"><p class="brand">GOOD MORNING</p><h2>よく寝ました。</h2><div id="ending-summary"></div></div>
    </section>

    <aside id="debug-panel" class="debug-panel hidden">
      <strong>DEBUG</strong><button data-debug="boost" type="button">資源を足す</button><button data-debug="prestige" type="button">Prestige可能にする</button><button data-debug="reset" type="button">セーブ削除</button>
    </aside>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
